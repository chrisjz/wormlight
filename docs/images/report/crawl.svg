<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="Checkpoint 1's speed for the real wiring and the ten tuned rewirings">
<style>
svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --grid: #d1d9e0; --band: #eef1f4; --real: #cf222e; --null: #0969da; }
@media (prefers-color-scheme: dark) {
  svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --grid: #3d444d; --band: #1c2128; --real: #ff7b72; --null: #4493f8; }
}
.bg { fill: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
.muted { fill: var(--muted); font-size: 12px; }
.grid { stroke: var(--grid); stroke-width: 1; }
.band { fill: var(--band); }
.real { fill: var(--real); stroke: var(--real); }
.null { fill: var(--null); stroke: var(--null); }
.hollow { fill: none; stroke: var(--null); stroke-width: 1.5; }
.line { fill: none; stroke: var(--fg); stroke-width: 2; }
.dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.fade { opacity: 0.45; }
</style>
<rect width="720" height="410" class="bg"/>
<rect x="235.2" y="30" width="115.2" height="290" class="band"/>
<rect x="350.4" y="30" width="345.6" height="290" class="band fade"/>
<text x="177.6" y="22" class="muted" text-anchor="middle">fail</text>
<text x="292.8" y="22" class="muted" text-anchor="middle">partial</text>
<text x="427.2" y="22" class="muted" text-anchor="middle">pass</text>
