name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Typecheck & build
        run: npm run build
      - name: Fidelity ledger is up to date
        run: npm run docs:check

  # Rebuilds the runtime data from its pinned sources and fails if any committed output differs. The
  # cache holds downloads named by their digest, each checked on read, so any earlier cache is safe to
  # start from; it is saved even when the check fails, so a failing run doesn't download again.
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: data-${{ hashFiles('data/sources.json', 'data/c302-cells.sha256') }}
          restore-keys: data-
      - name: Data build is up to date
        run: npm run data:check
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The rendered pixels: the built app in headless Chrome, WebGPU on Mesa lavapipe (software Vulkan; these
  # runners have no GPU), a fixed set of views read back through the app's own snapshot and compared with
  # the baselines in tests/visual/baseline/. It catches what lint, types and unit tests can't, such as a
  # shader or bind-group change that blanks a pass. After Universe Atlas's job.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Install Mesa lavapipe (software Vulkan)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1
      - name: Capture views (WebGPU on lavapipe)
        run: npm run visual:capture
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          WEBGPU_CI: 1
      - name: Compare with baselines
        run: npm run visual:compare
      - name: Upload captures and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual
          path: visual-out/
          retention-days: 14

  # A Pages site is public even when its repository is private, so deploying
  # stays off until the project is ready. To go live: Settings → Pages →
  # Source: GitHub Actions, then set the repository variable DEPLOY_PAGES=true.
  # BASE_PATH defaults to the project-site path; set the variable BASE_PATH=/
  # if a custom domain is added.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_PAGES == 'true'
    needs: [checks, data, visual]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/wormlight/' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5
